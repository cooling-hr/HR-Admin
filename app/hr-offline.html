    <!-- درع الحماية الذكي: محظور على العامة وشاشة القفل، ومفتوح تلقائياً لمدير النظام (Admin) للتشخيص والتطوير -->
    <script>
        window.__IS_ADMIN_DEV_UNLOCKED = false;
        (function() {
            function blockAction(e) {
                // إذا كان المستخدم مسجلاً كـ مدير نظام (Admin) أو قام بفتح قفل المطورين: يُسمح له بـ F12 والتفتيش فوراً!
                if (window.__IS_ADMIN_DEV_UNLOCKED === true) {
                    return true;
                }

                e = e || window.event;
                if (!e) return true;
                
                // Block F12 (code 123)
                if (e.key === 'F12' || e.keyCode === 123 || e.which === 123) {
                    if (e.preventDefault) e.preventDefault();
                    if (e.stopPropagation) e.stopPropagation();
                    e.returnValue = false;
                    return false;
                }
                // Block Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C, Ctrl+Shift+K
                if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67 || e.keyCode === 75 || ['I','i','J','j','C','c','K','k'].includes(e.key))) {
                    if (e.preventDefault) e.preventDefault();
                    if (e.stopPropagation) e.stopPropagation();
                    e.returnValue = false;
                    return false;
                }
                // Block Ctrl+U (View Source)
                if (e.ctrlKey && (e.keyCode === 85 || e.key === 'u' || e.key === 'U')) {
                    if (e.preventDefault) e.preventDefault();
                    if (e.stopPropagation) e.stopPropagation();
                    e.returnValue = false;
                    return false;
                }
            }

            // Bind to all capture stages immediately
            window.addEventListener('keydown', blockAction, true);
            document.addEventListener('keydown', blockAction, true);
            window.onkeydown = blockAction;
            document.onkeydown = blockAction;

            // Block Context Menu (Right Click) for non-admins
            function blockContext(e) {
                if (window.__IS_ADMIN_DEV_UNLOCKED === true) return true;
                if (e && e.preventDefault) e.preventDefault();
                return false;
            }
            window.addEventListener('contextmenu', blockContext, true);
            document.addEventListener('contextmenu', blockContext, true);
            window.oncontextmenu = blockContext;
            document.oncontextmenu = blockContext;
        })();
    </script>

        /* ---------------------------------------------------- */
        /* منتقي التاريخ المخصص المتطور (Custom DatePicker) */
        /* ---------------------------------------------------- */
        .custom-datepicker {
          position: absolute;
          z-index: 10000;
          background: #ffffff;
          border: 1px solid #e2e8f0;
          border-radius: 12px;
          box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
          padding: 14px;
          width: 280px;
          direction: rtl;
          font-family: inherit;
          user-select: none;
        }
        .custom-datepicker-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 12px;
          border-bottom: 1px solid #f1f5f9;
          padding-bottom: 8px;
        }
        .custom-datepicker-header-btn {
          cursor: pointer;
          padding: 4px 10px;
          font-size: 13px;
          font-weight: 700;
          border-radius: 6px;
          color: #1e3a8a;
          transition: all 0.15s;
        }
        .custom-datepicker-header-btn:hover {
          background: #eff6ff;
          color: #1d4ed8;
        }
        .custom-datepicker-content {
          max-height: 200px;
          overflow-y: auto;
        }
        .custom-datepicker-grid-years {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 6px;
          max-height: 180px;
          overflow-y: auto;
          padding-right: 2px;
        }
        .custom-datepicker-grid-years::-webkit-scrollbar {
          width: 4px;
        }
        .custom-datepicker-grid-years::-webkit-scrollbar-track {
          background: none;
        }
        .custom-datepicker-grid-years::-webkit-scrollbar-thumb {
          background: #cbd5e1;
          border-radius: 2px;
        }
        .custom-datepicker-grid-months {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 8px;
        }
        .custom-datepicker-grid-days {
          display: grid;
          grid-template-columns: repeat(7, minmax(0, 1fr));
          gap: 4px;
        }
        .custom-datepicker-weekdays {
          display: grid;
          grid-template-columns: repeat(7, minmax(0, 1fr));
          text-align: center;
          font-weight: 700;
          font-size: 11px;
          color: #64748b;
          margin-bottom: 8px;
          border-bottom: 1px solid #f1f5f9;
          padding-bottom: 6px;
        }
        .custom-datepicker-item {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 32px;
          font-size: 12px;
          border-radius: 6px;
          cursor: pointer;
          transition: all 0.1s;
          color: #334155;
        }
        .custom-datepicker-item:hover:not(.cdp-empty) {
          background: #f1f5f9;
          color: #0f172a;
        }
        .custom-datepicker-item.selected {
          background: #3b82f6 !important;
          color: #ffffff !important;
          font-weight: 700;
          box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.4);
        }
        .custom-datepicker-item.cdp-empty {
          cursor: default;
        }

        /* تنسيق الطباعة عالي الكثافة (توفير الورق وتقليص الصفحات من 6 إلى 2-3 صفحات) */
        @media print {
            @page {
                size: A4 portrait;
                margin: 6mm 5mm 6mm 5mm;
            }

            /* إظهار المعاينة فقط */
            .preview-overlay { 
                background: white !important; 
                position: static !important; 
                display: block !important; 
                padding: 0 !important;
                margin: 0 !important;

                box-shadow: none !important; 
                max-width: 100% !important;

                margin-bottom: 6px !important;

                padding: 2px 0 !important;

            .preview-footer { display: none !important; }
            
            /* محتوى الجدول فائق التكثيف */
            .preview-body { 
                max-height: none !important; 
                overflow: visible !important; 
                padding: 0 !important; 
            }
            
            /* حجم الخط رُفع من 7.5pt إلى 10pt بطلب الموظفين — كان صغيراً جداً للقراءة المطبوعة.
               ارتفاع الصف والحشو ارتفعا بما يناسب، فيقلّ عدد الأسماء في الصفحة تلقائياً (كان ~50) */
            .preview-table { 
                font-size: 10pt !important; 
                page-break-inside: auto;
                width: 100% !important;
                border-collapse: collapse !important;
                line-height: 1.25 !important;

            }

                page-break-after: auto; 
                height: 26px !important;
            }
            
            .preview-table th {

                color: black !important;

                color: black !important; 
                background: white !important;
                font-size: 10pt !important;

            .preview-table tbody tr:nth-child(even) td {
                background: #f8fafc !important;

        /* طباعة مصفوفة الأيام: أفقية إلزاماً — ثلاثون عموداً لا تسع في صفحة عمودية */
        @media print {

            /* visibility لا display: القالب مُدرَج داخل غلاف التطبيق نفسه، فإخفاء الغلاف
               بـdisplay:none يُخفيه معه مهما فعلنا. أما visibility فتتوارث ويمكن نقضها
               على الفرع المطلوب وحده — وهي الطريقة الوحيدة التي تعمل مع هذه البنية. */
            body.printing-matrix #root > * { visibility: hidden !important; }
            body.printing-matrix .matrix-print-only,
            body.printing-matrix .matrix-print-only * { visibility: visible !important; }
            body.printing-matrix .matrix-print-only {
                display: block !important;
                position: absolute !important;
                top: 0 !important; right: 0 !important; left: 0 !important;
                background: white !important;

            body.printing-matrix .matrix-print-only td {
                border: 1px solid #94a3b8 !important;

                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            body.printing-matrix .matrix-print-only tr { page-break-inside: avoid !important; }

        /* طباعة بطاقة المنتسب من نافذة المعاينة (زرّ «طباعة بطاقة المنتسب A4»).
           النافذة مرسومة عبر ReactDOM.createPortal مباشرة تحت body، خارج #root —
           فيُخفى كل ما سواها من أبناء body بـdisplay:none، وتبقى البطاقة وحدها على الورق.

           تاريخ ما قبله يستحق الذكر، لأن الحلّين السابقين يبدوان معقولين:
           1) كانت النافذة داخل main، وقاعدة الطباعة العامة تُخفي main بـdisplay:none،
              ولا يلغي حفيدٌ display:none على سلفه ⇒ صفحة بيضاء (مقيس: شاشة 1400×900، ورق 0×0).
           2) عزلٌ بـvisibility كطباعة المصفوفة أظهرها، لكن المحتوى المخفي بقي شاغلاً مساحته
              فأخرج ورقة ثانية بيضاء. وإلغاء ارتفاع الغلاف أسقطها، غير أنه اعتمد على شرط خفيّ
              (ألّا يكون بين الغلاف والبطاقة سلفٌ مُموضَع أو محوَّل) يكسره تعديل قادم بصمت.
              نبّهت إليه مراجعة Codex، فحلّ الـportal محلّ الحلّين من الجذر. */
        @media print {
            /* كل أبناء body المباشرين لا #root وحدها: ما تُلحقه شيفرات أخرى بـbody (منتقي
               التاريخ مثلاً) كان سيُطبع مع البطاقة — نبّهت إليه مراجعة Codex. والبطاقة ابن
               مباشر لـbody (portal)، وقاعدتها أدناه أعلى تحديداً (0,2,1 مقابل 0,1,1) فتبقى. */
            body.printing-card > * { display: none !important; }
            body.printing-card .card-print-root {
                display: block !important;
                position: static !important;
                background: white !important;
                backdrop-filter: none !important;
                padding: 0 !important;
            }
            /* النافذة على الشاشة محدودة الارتفاع وقابلة للتمرير؛ على الورق تُفرَد كاملة */
            body.printing-card .card-print-root,
            body.printing-card .card-print-root * {
                overflow: visible !important;
                max-height: none !important;
            }
        }

        /* حركة فتح التبويبات                                                 */
        /*                                                                   */
        /* على حاوية المحتوى وحدها لا على صفوف الجدول: عند 144 موظفاً تكون    */
        /* الحركة على كل صف تعثّراً لا زينة. opacity وtransform فقط — الاثنان  */
        /* يُنفَّذان على المعالج الرسومي بلا إعادة تخطيط (layout).             */
        /*                                                                   */
        /* داخل @media screen عمداً: الطباعة لا ترى حركة ولا شفافية جزئية،    */
        /* فلا تخرج كشوفات باهتة لو طُبعت أثناء الحركة.                       */
        /* ================================================================= */
        @media screen {
            @keyframes tabEnter {
                from { opacity: 0; transform: translateY(6px); }
                to   { opacity: 1; transform: none; }
            }
            /* both يُبقي الحالة النهائية (transform: none) فلا يبقى محوَّلاً بعد
               انتهائها — عنصر محوَّل يصير مرجعاً للعناصر ذات position: fixed. */
            .tab-enter {
                animation: tabEnter 170ms cubic-bezier(0.16, 1, 0.3, 1) both;
            }
        }

        /* من يضبط نظامه على «تقليل الحركة» (دوار الحركة، حساسية بصرية) يراها فوراً بلا انتقال */
        @media (prefers-reduced-motion: reduce) {

    <!--                                                                   -->
    <!-- طبقة CSS مستقلة تماماً: لا تمسّ أي className في شجرة React.        -->
    <!-- تُعيد تعريف الأصناف البنيوية المستعملة فعلاً تحت data-theme="dark". -->
    <!--                                                                   -->
    <!-- كل القواعد داخل @media screen عمداً: فيتصرّف محرّك الطباعة كأن       -->
    <!-- الوضع الليلي غير موجود، وتخرج الكشوفات الرسمية بيضاء دائماً.       -->
    <!-- ================================================================= -->
    <script>
        // يُطبَّق قبل أول رسم لتفادي وميض أبيض عند فتح الصفحة
        (function () {
            try {
                var saved = localStorage.getItem('hrTheme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (saved === 'dark' || (!saved && prefersDark)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) { /* بعض المتصفحات تحظر التخزين — نتجاهل ونبقى على الوضع النهاري */ }
        })();
        window.__toggleHrTheme = function () {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            try { localStorage.setItem('hrTheme', isDark ? 'light' : 'dark'); } catch (e) {}
            return !isDark;
        };
    </script>

        html[data-theme="dark"] .bg-indigo-50\/30 { background-color: #16233f !important; }
        html[data-theme="dark"] .bg-rose-50\/20 { background-color: #3b1520 !important; }
        html[data-theme="dark"] .bg-indigo-50\/10 { background-color: #16233f !important; }
        html[data-theme="dark"] .bg-teal-50\/30 { background-color: #0c2f31 !important; }
        html[data-theme="dark"] .bg-amber-50\/10 { background-color: #3b2a09 !important; }
        html[data-theme="dark"] .bg-white\/85 { background-color: #131c2b !important; }
        html[data-theme="dark"] .bg-white\/80 { background-color: #131c2b !important; }
        /* نمط الشرائح الموحّد (seg-track): الحبّة النشطة bg-white تُعتَّم إلى #131c2b فتصير أغمق
           من مسارها (#1a2536) كأنها ثقب لا حبّة مرفوعة — فتُرفَع هنا فوقه. وتحويم الأزرار
           (hover:bg-slate-200 / hover:text-slate-700) لم يكن معرَّفاً قط، فكان يومض بلونه
           النهاري: خلفية فاتحة تحت نص فاتح في الأقسام، ونص داكن فوق مسار داكن في الشرائح. */
        html[data-theme="dark"] .seg-track .bg-white { background-color: #2b3a52 !important; }
        html[data-theme="dark"] .hover\:bg-slate-200:hover { background-color: #24324a !important; }
        html[data-theme="dark"] .hover\:text-slate-700:hover { color: #e6edf5 !important; }
        /* شرائح seg-track (المواصفة §14.2): على شاشة عريضة كان كل خيار يمتد نحو 600px بلا فاصل،
           فيُقرأ الشريط زراً واحداً طويلاً. صار المسار بعرض أطول خياراته لا بعرض الشريط، وبين
           الخيارات فاصل رفيع يختفي بجوار الخيار النشط أو المُحوَّم، وللتحويم لون خفيف يُظهر حدود
           كل خيار. الفاصل من 640px فقط: تحتها تتكدّس الخيارات صفوفاً فلا معنى لفاصل عمودي.
           هنا لا في JSX لأن الفاصل عنصر ::before يتبع aria-pressed، ولونه من المتغيرات فيتبع الليلي. */
        .seg-opt { position: relative; }
        .seg-opt[aria-pressed="false"]:hover { background-color: rgb(255 255 255 / 0.6); }
        html[data-theme="dark"] .seg-opt[aria-pressed="false"]:hover { background-color: rgb(255 255 255 / 0.06) !important; }
        @media (min-width: 640px) {
            .seg-opt + .seg-opt::before {
                content: ''; position: absolute; inset-inline-start: calc(-0.125rem - 0.5px);
                top: 25%; bottom: 25%; width: 1px; background-color: var(--border-strong);
                transition: opacity 150ms;
            }
            .seg-opt[aria-pressed="true"]::before,
            .seg-opt[aria-pressed="true"] + .seg-opt::before,
            .seg-opt:hover::before,
            .seg-opt:hover + .seg-opt::before { opacity: 0; }
        }

        /* ---- بقية الدرجات الفاتحة (100 و200) المستعملة في الشارات ---- */
        html[data-theme="dark"] .bg-gray-200      { background-color: #24324a !important; }
        html[data-theme="dark"] .bg-amber-200     { background-color: #4a360b !important; }
        html[data-theme="dark"] .bg-blue-100,
        html[data-theme="dark"] .bg-indigo-100    { background-color: #16233f !important; }
        html[data-theme="dark"] .bg-blue-200      { background-color: #1e2f52 !important; }
        html[data-theme="dark"] .bg-emerald-100,
        html[data-theme="dark"] .bg-emerald-200,
        html[data-theme="dark"] .bg-green-100     { background-color: #0e3b2c !important; }
        html[data-theme="dark"] .bg-purple-100    { background-color: #251640 !important; }
        html[data-theme="dark"] .bg-purple-200    { background-color: #2f1c52 !important; }
        html[data-theme="dark"] .bg-red-100,
        html[data-theme="dark"] .bg-rose-100      { background-color: #3b1518 !important; }
        html[data-theme="dark"] .bg-red-200,
        html[data-theme="dark"] .bg-rose-200      { background-color: #4a1a1e !important; }
        html[data-theme="dark"] .bg-teal-100      { background-color: #0c2f31 !important; }
        html[data-theme="dark"] .bg-sky-100       { background-color: #102a40 !important; }

        /* ---- كل نص داكن (درجة 600 فأعلى) مستعمل في الواجهة ---- */
        /* هذه الدرجات مصمَّمة لخلفيات فاتحة، فتصبح غير مقروءة بعد تعتيم الأسطح. */
        /* الدرجات 500 فما دون تُترك عمداً: هي أصلاً فاتحة وتجلس فوق ترويسات داكنة. */
        html[data-theme="dark"] .text-blue-600,
        html[data-theme="dark"] .text-blue-800,
        html[data-theme="dark"] .text-sky-800,
        html[data-theme="dark"] .text-blue-950
            { color: #93c5fd !important; }
        html[data-theme="dark"] .text-orange-600,
        html[data-theme="dark"] .text-orange-700,
        html[data-theme="dark"] .text-orange-800
            { color: #fdba74 !important; }
        html[data-theme="dark"] .text-teal-600,
        html[data-theme="dark"] .text-teal-800,
        html[data-theme="dark"] .text-teal-950
            { color: #5eead4 !important; }
        html[data-theme="dark"] .text-amber-600,
        html[data-theme="dark"] .text-amber-950
            { color: #fcd34d !important; }
        html[data-theme="dark"] .text-emerald-600,
        html[data-theme="dark"] .text-green-600
            { color: #6ee7b7 !important; }
        html[data-theme="dark"] .text-indigo-600,
        html[data-theme="dark"] .text-indigo-950
            { color: #a5b4fc !important; }
        html[data-theme="dark"] .text-purple-600,
        html[data-theme="dark"] .text-purple-800
            { color: #c4b5fd !important; }
        html[data-theme="dark"] .text-rose-600,
        html[data-theme="dark"] .text-rose-900
            { color: #fda4af !important; }
        html[data-theme="dark"] .text-cyan-800
            { color: #67e8f9 !important; }
        html[data-theme="dark"] .text-red-600
            { color: #fca5a5 !important; }
        html[data-theme="dark"] .text-slate-950
            { color: #e6edf5 !important; }

        /* الأزرار الممتلئة والتدرّجات تبقى كما هي: هي أصلاً داكنة ومقروءة. */
        /* وأصناف bg-white/10..30 تبقى كذلك: هي بريق فوق ترويسات داكنة. */
    }

    <script>
        // تسجيل Service Worker لتفعيل التثبيت كتطبيق هاتف — فقط على الرابط المنشور فعلياً؛
        // لا معنى له ولا تسجّله المتصفحات أصلاً عند فتح الملف محلياً (file://).
        if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').catch(function() {});
            });
        }
    </script>
